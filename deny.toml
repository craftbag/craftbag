[graph]
targets = []
all-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Only licenses on the workspace or fuzz graphs. Unused allowances
# (LLVM-exception, BSD-2, BSD-3) let a future crate in without review.
# NCSA is unused on the library graph; fuzz libfuzzer-sys needs it.
allow = [
    "Apache-2.0",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
