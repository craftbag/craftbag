# Missing release tags are skipped by
# factory/scripts/lychee-unpublished-compare-excludes.py
# which writes lychee.ci.toml. Do not skip every GitHub compare
# link here. A tag that already exists still has to answer.
exclude = [
  'https://img.shields.io',
  'https://app.fossa.com',
  'https://bestpractices.dev',
  'https://api.securityscorecards.dev',
  'https://securityscorecards.dev',
  'https://crates.io',
  'https://docs.rs',
]
exclude_path = ['.git', 'target', 'fuzz/artifacts']
max_retries = 2
timeout = 20
