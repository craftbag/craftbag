[workspace]
members = ["crates/craftbag-cli", "crates/craftbag-mcp"]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "craftbag"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Reserved."
repository = "https://github.com/craftbag/craftbag"
keywords = []
categories = []
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tempfile = "3"

[lib]
path = "src/lib.rs"
