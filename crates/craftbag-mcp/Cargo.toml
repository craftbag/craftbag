[package]
name = "craftbag-mcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "MCP stdio server for craftbag list, load, why, and validate"
repository = "https://github.com/craftbag/craftbag"
keywords = ["skills", "mcp", "agents"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[[bin]]
name = "craftbag-mcp"
path = "src/main.rs"

[dependencies]
craftbag = { version = "0.1.1", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
serde_json = "1"
tempfile = "3"
