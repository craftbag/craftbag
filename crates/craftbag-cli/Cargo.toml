[package]
name = "craftbag-cli"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Reserved."
repository = "https://github.com/craftbag/craftbag"
keywords = []
categories = []
publish = false

[[bin]]
name = "craftbag"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
craftbag = { path = "../.." }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
