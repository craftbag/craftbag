name: Auto-approve

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    name: Auto-approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Same-repo heads only. Fork PRs get a read-only GITHUB_TOKEN on
    # pull_request, so createReview(APPROVE) fails. Do not include
    # dependabot[bot]: dependabot-auto-merge.yml owns those PRs.
    # Approve still runs for constitution and release titles. Auto-merge
    # is gated in the later step (CONSTITUTION item 9).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.actor == 'SebTardif'
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Auto-approve PR
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4
      - name: Enable auto-merge
        # Skip drafts (GitHub rejects enablePullRequestAutoMerge).
        # Skip release, publish, and constitution titles. Path skip
        # for factory/CONSTITUTION.md is below.
        if: >-
          !github.event.pull_request.draft &&
          !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') &&
          github.event.pull_request.title != 'chore: amend constitution' &&
          !startsWith(github.event.pull_request.title, 'release:') &&
          !startsWith(github.event.pull_request.title, 'chore(release)') &&
          !startsWith(github.event.pull_request.title, 'publish')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          paths=$(gh pr diff --name-only "$PR" --repo "$REPO")
          if echo "$paths" | grep -qx 'factory/CONSTITUTION.md'; then
            echo "Skip auto-merge: constitution in diff"
            exit 0
          fi
          gh pr merge --auto --squash "$PR" --repo "$REPO" \
            || echo "Could not enable auto-merge. The PR was approved."
      - name: Skip auto-merge for draft PRs
        if: github.event.pull_request.draft
        run: |
          echo "Draft PR ${{ github.event.pull_request.number }}: auto-merge deferred until ready for review."
