# Publish server.json with GitHub OIDC. Dispatch only until the
# registry accepts the cargo package marker on a published version.
name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.2.1)"
        required: true
        type: string

concurrency:
  group: publish-mcp-registry-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
      - name: Publish
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher validate server.json
          ./mcp-publisher publish server.json
