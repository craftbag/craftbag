# Lists server.json on the official MCP Registry after the cargo README
# for that version contains the visible mcp-name line.
# A GITHUB_TOKEN release event does not start a second workflow, so
# release.yml calls this job after crates.io publish.
name: Publish MCP Registry

on:
  workflow_call:
    inputs:
      version:
        description: "Tag or version (for example v0.2.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Tag or version. Empty uses the latest GitHub Release."
        required: false
        type: string
        default: ""

concurrency:
  group: publish-mcp-registry-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(gh release view --json tagName --jq .tagName)"
          fi
          version="${version#v}"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Could not resolve a package version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"
      - name: Wait for the crates.io ownership marker
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MCP_NAME: io.github.craftbag/craftbag-mcp
          CRATES_UA: craftbag-mcp-registry (https://github.com/craftbag/craftbag)
        run: |
          set -euo pipefail
          # 20 * 30s. crates.io README lag after cargo publish.
          attempts=20
          for i in $(seq 1 "$attempts"); do
            http_code="$(curl -sS -L -o /tmp/crates-readme.html -w '%{http_code}' \
              -A "$CRATES_UA" \
              "https://crates.io/api/v1/crates/craftbag-mcp/${VERSION}/readme" \
              || echo "000")"
            if [ "$http_code" = "200" ] \
              && grep -Fq "mcp-name: ${MCP_NAME}" /tmp/crates-readme.html; then
              echo "cargo marker present on crates.io ${VERSION}"
              exit 0
            fi
            echo "cargo marker not visible for ${VERSION} (http=${http_code}, attempt ${i}/${attempts})"
            if [ "$i" -lt "$attempts" ]; then
              sleep 30
            fi
          done
          echo "Timed out waiting for mcp-name on crates.io ${VERSION}" >&2
          exit 1
      - name: Stamp server.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '
            .version = $v
            | .packages |= map(.version = $v)
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          desc_len="$(jq -r '.description | length' server.json)"
          if [ "$desc_len" -gt 100 ]; then
            echo "server.json description is ${desc_len} chars; registry max is 100" >&2
            exit 1
          fi
          echo "server.json ${VERSION} description ${desc_len} chars"
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # This job has id-token: write. Pin the binary. Do not follow
          # the floating "latest" tag.
          version=1.8.1
          file="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$file" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${version}/${file}"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  ${file}" \
            | sha256sum -c -
          tar xzf "$file" mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Authenticate
        run: ./mcp-publisher login github-oidc
      - name: Validate server.json
        run: ./mcp-publisher validate server.json
      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          set +e
          out="$(./mcp-publisher publish server.json 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # A retry of this tag is not a new version. The registry
          # rejects a second publish of the same semver.
          if printf '%s' "$out" | grep -Eqi 'duplicate|already exists|already published'; then
            echo "OK: this version is already on the registry"
            exit 0
          fi
          exit "$code"
      - name: Verify listing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsSL \
              "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.craftbag/craftbag-mcp")"
            if printf '%s' "$body" | jq -e --arg v "$VERSION" '
              .servers[]?
              | .server
              | select(.name == "io.github.craftbag/craftbag-mcp")
              | select(.version == $v)
            ' >/dev/null; then
              echo "Verified io.github.craftbag/craftbag-mcp@${VERSION}"
              exit 0
            fi
            echo "Listing not visible yet (attempt ${i})"
            sleep 15
          done
          echo "Search did not return io.github.craftbag/craftbag-mcp@${VERSION}" >&2
          exit 1
