name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate stays under two seconds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.85"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: hyperfine@1.18.0
      - name: Build
        run: cargo build --release -p craftbag-cli
      - name: Time validate
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench-skill
          cat > /tmp/bench-skill/SKILL.md <<'EOF'
          ---
          name: bench-skill
          description: Bench fixture
          ---
          # Bench
          Body.
          EOF
          hyperfine --warmup 3 --min-runs 10 \
            --export-json /tmp/bench.json \
            "./target/release/craftbag validate /tmp/bench-skill"
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/bench.json"))
          seconds = data["results"][0]["mean"]
          print(f"mean_s={seconds:.3f}")
          if seconds > 2.0:
              raise SystemExit(f"FAIL: validate mean {seconds:.3f}s exceeds 2s")
          PY
