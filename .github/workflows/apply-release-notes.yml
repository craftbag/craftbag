# Apply curated notes from branch release-note-<semver> onto a
# GitHub Release, then delete that branch. Does not compile.
name: Apply release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.2.1)"
        required: true
        type: string

concurrency:
  group: apply-release-notes-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      RELEASE_NOTES: ${{ vars.RELEASE_NOTES }}
      RELEASE_NOTES_TAG: ${{ vars.RELEASE_NOTES_TAG }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply curated notes
        run: bash factory/scripts/apply-release-notes.sh
