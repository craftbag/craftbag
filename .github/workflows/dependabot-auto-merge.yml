name: Dependabot Auto-Merge

on:
  pull_request_target:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect a SHA pin labeled as a major
        id: sha-pin
        env:
          PREV: ${{ steps.metadata.outputs.previous-version }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # previous-version is only the first dependency in a group.
          # update-type is the highest bump in that group. A real major
          # may sit beside a commit pin. Every previous version has to
          # be a 40-hex pin before this PR is treated as a false major.
          sha=false
          if [ -n "${DEPS}" ] && [ "${DEPS}" != "null" ]; then
            if printf '%s' "$DEPS" | jq -e '
              type == "array" and length > 0 and
              all(.[]; (.prevVersion // "") | test("^[0-9a-f]{40}$"))
            ' >/dev/null; then
              sha=true
            fi
          elif printf '%s' "$PREV" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=true
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Approve and enable auto-merge (patch/minor only)
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.sha-pin.outputs.sha == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
      - name: Skip major updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-major' &&
          steps.sha-pin.outputs.sha != 'true'
        run: echo "Skipping major version update; requires manual review"
