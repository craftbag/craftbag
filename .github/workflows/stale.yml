name: Stale

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: stale
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stale:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "ready,security,pinned"
          exempt-pr-labels: "autorelease: pending"
          stale-issue-message: >
            This issue has had no activity for 60 days. It will close
            in 14 days unless someone comments.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It will
            close in 14 days unless someone comments or pushes.
          close-issue-message: "Closed as stale. Reopen it if it still matters."
          close-pr-message: "Closed as stale. Reopen it if it still matters."
