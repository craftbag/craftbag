# Tag or dispatch. One trusted crates.io upload, not the PR test matrix
# (ci-build-once Recipe E). Do not re-run nextest, clippy, fuzz, or a
# second compile of the product here.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Release tag (for example v0.2.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tag push: the tag commit. Dispatch: this workflow file
          # (main tip) while TAG still names the GitHub Release.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || (inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref) }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.85"
      - name: Check publish script
        run: bash factory/scripts/publish-crates.sh --self-test
      # crates.io matches the OIDC caller filename. release-please.yml
      # calls this file, and a direct tag push runs release.yml. Both
      # names are trusted publishers. The API token stays until a tag
      # job exchanges an OIDC token on its own.
      - name: Authenticate with crates.io
        id: crates-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: bash factory/scripts/publish-crates.sh
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              print("FAIL: tag must start with v:", tag)
              sys.exit(1)
          version = tag[1:]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          needle = f"## [{version}]"
          start = text.find(needle)
          if start < 0:
              print("FAIL: CHANGELOG missing", needle)
              sys.exit(1)
          section = text[start:]
          nxt = section.find("\n## [", 1)
          body = (section if nxt < 0 else section[:nxt]).strip()
          pathlib.Path("/tmp/release-notes.md").write_text(
              f"{body}\n", encoding="utf-8"
          )
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "OK: release $TAG exists"
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          fi

  dist-binaries:
    name: Dist ${{ matrix.target }}
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tag push: the tag commit. Dispatch: this workflow file
          # (main tip) while TAG still names the GitHub Release.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || (inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref) }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-dist@0.31.0
      - name: Install the Linux arm64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.arch == 'X64'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Dist build
        run: dist build --artifacts=local --target ${{ matrix.target }}
      - name: Pack combined archive
        shell: bash
        run: |
          set -euo pipefail
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" factory/scripts/publish-install-channels.py \
            --pack \
            --artifacts-dir target \
            --out-dir "${{ runner.temp }}/craftbag-dist"
      - name: Record archive path
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          # The packer writes the archive and archive.sha256. find's *
          # matches both, so exclude the sidecar or head -1 can sign it.
          archive=$(find "${{ runner.temp }}/craftbag-dist" -name 'craftbag-${{ matrix.target }}.*' \
            ! -name '*.sha256' ! -name '*.sigstore' ! -name '*.spdx.json' ! -name '*.intoto.jsonl' \
            | sort)
          lines=$(printf '%s\n' "$archive" | grep -c . || true)
          if [ "$lines" -ne 1 ]; then
            echo "expected one combined archive, found ${lines}" >&2
            printf '%s\n' "$archive" >&2
            exit 1
          fi
          echo "path=${archive}" >> "$GITHUB_OUTPUT"
      - name: SBOM
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with:
          file: ${{ steps.archive.outputs.path }}
          format: spdx-json
          output-file: ${{ runner.temp }}/craftbag-dist/sbom-${{ matrix.target }}.spdx.json
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Sign the archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.archive.outputs.path }}"
          cosign sign-blob --yes --bundle "${archive}.sigstore" "$archive"
      - name: Attest the archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/craftbag-dist"
          files=("${{ steps.archive.outputs.path }}" "${{ steps.archive.outputs.path }}.sha256" "${{ steps.archive.outputs.path }}.sigstore")
          if [ ! -f "${{ steps.archive.outputs.path }}.sha256" ]; then
            echo "checksum sidecar was not packed" >&2
            exit 1
          fi
          sbom="${dest}/sbom-${{ matrix.target }}.spdx.json"
          [ -f "$sbom" ] && files+=("$sbom")
          if [ -n "${{ steps.attest.outputs.bundle-path }}" ]; then
            intoto="${dest}/craftbag-${{ matrix.target }}.intoto.jsonl"
            cp "${{ steps.attest.outputs.bundle-path }}" "$intoto"
            files+=("$intoto")
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  publish-taps:
    name: Publish Homebrew and Scoop
    needs: dist-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tag push: the tag commit. Dispatch: this workflow file
          # (main tip) while TAG still names the GitHub Release.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || (inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref) }}
          path: project
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          owner: craftbag
          repositories: |
            homebrew-tap
            scoop-bucket
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: craftbag/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: craftbag/scoop-bucket
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: scoop-bucket
      - name: Download combined archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/craftbag-dist
          gh release download "$TAG" --repo craftbag/craftbag \
            --pattern 'craftbag-*' --dir /tmp/craftbag-dist
      - name: Update and push formulae
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 project/factory/scripts/publish-install-channels.py \
            --version "$TAG" \
            --hashes-dir /tmp/craftbag-dist \
            --formula homebrew-tap/Formula/craftbag.rb \
            --scoop scoop-bucket/bucket/craftbag.json
          git config --global user.name "craftbag-approve[bot]"
          git config --global user.email "41898282+craftbag-approve[bot]@users.noreply.github.com"
          version="${TAG#v}"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          (
            cd homebrew-tap
            git add Formula/craftbag.rb
            if git diff --cached --quiet; then
              echo "OK: Homebrew formula unchanged"
            else
              git commit -m "craftbag ${version}"
              git push origin HEAD:main
            fi
          )
          (
            cd scoop-bucket
            git add bucket/craftbag.json
            if git diff --cached --quiet; then
              echo "OK: Scoop manifest unchanged"
            else
              git commit -m "craftbag ${version}"
              git push origin HEAD:main
            fi
          )

  publish-winget:
    name: Publish WinGet
    needs: dist-binaries
    permissions:
      contents: read
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    uses: ./.github/workflows/publish-winget.yml
    with:
      tag: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}

  publish-chocolatey:
    name: Publish Chocolatey
    needs: dist-binaries
    permissions:
      contents: read
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      tag: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}

  publish-smithery:
    name: Publish Smithery
    needs: dist-binaries
    permissions:
      contents: read
    secrets:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
    uses: ./.github/workflows/publish-smithery.yml
    with:
      tag: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}

  publish-mcp-registry:
    name: Publish MCP Registry
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      version: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
