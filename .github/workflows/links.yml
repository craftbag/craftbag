name: Links

on:
  pull_request:
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
      - "factory/scripts/lychee-unpublished-compare-excludes.py"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lychee:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Release PRs link a compare range before the new tag exists.
      # Skip only that URL. A tag that exists is still fetched.
      - name: Skip compare links for unpublished tags
        run: python3 factory/scripts/lychee-unpublished-compare-excludes.py --write-config lychee.ci.toml
        env:
          GIT_TERMINAL_PROMPT: "0"
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.ci.toml --verbose "**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
