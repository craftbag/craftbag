# External reports get needs-triage. Maintainers skip the inbox.
name: Issue Triage

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to re-label"
        required: true
        type: string

concurrency:
  group: issue-triage-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Label issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - name: Apply triage labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number }}
        with:
          script: |
            // MEMBER includes org members with no access to this repo.
            // COLLABORATOR includes read and triage invites. Those are
            // not maintainers. Only the repo owner skips the permission
            // lookup; everyone else needs admin, maintain, or write.
            const TRUSTED_ASSOC = new Set(["OWNER"]);
            const TRUSTED_PERM = new Set(["admin", "maintain", "write"]);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function isTrusted(login, association) {
              if (TRUSTED_ASSOC.has(association)) {
                return { trusted: true, reason: `association=${association}` };
              }
              try {
                const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username: login,
                });
                if (TRUSTED_PERM.has(perm.permission)) {
                  return { trusted: true, reason: `permission=${perm.permission}` };
                }
                return { trusted: false, reason: `permission=${perm.permission}` };
              } catch (e) {
                if (e.status === 404) {
                  return { trusted: false, reason: "not a collaborator" };
                }
                throw e;
              }
            }

            async function ensureLabels(issueNumber, login, association, existingNames) {
              const { trusted, reason } = await isTrusted(login, association);
              const names = new Set(existingNames);
              if (trusted) {
                if (!names.has("ready")) {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: issueNumber, labels: ["ready"],
                  });
                }
                if (names.has("needs-triage")) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: issueNumber, name: "needs-triage",
                    });
                  } catch (e) {
                    if (e.status !== 404) throw e;
                  }
                }
                core.info(`#${issueNumber} @${login}: ${reason} -> ready`);
                return;
              }
              if (names.has("ready")) {
                core.info(`#${issueNumber} @${login}: keep ready`);
                return;
              }
              if (!names.has("needs-triage")) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber, labels: ["needs-triage"],
                });
              }
              core.info(`#${issueNumber} @${login}: ${reason} -> needs-triage`);
            }

            if (context.eventName === "workflow_dispatch") {
              const n = parseInt(process.env.DISPATCH_ISSUE || "", 10);
              if (!n) {
                core.setFailed("workflow_dispatch requires issue_number");
                return;
              }
              const { data: issue } = await github.rest.issues.get({
                owner, repo, issue_number: n,
              });
              await ensureLabels(
                n,
                issue.user.login,
                issue.author_association,
                (issue.labels || []).map((l) => (typeof l === "string" ? l : l.name)),
              );
              return;
            }

            const issue = context.payload.issue;
            await ensureLabels(
              issue.number,
              issue.user.login,
              issue.author_association,
              (issue.labels || []).map((l) => (typeof l === "string" ? l : l.name)),
            );
