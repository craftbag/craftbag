name: Test Scoop install

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  release:
    types: [published]

concurrency:
  group: test-scoop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scoop-install:
    name: Scoop install
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Install from the craftbag bucket
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm get.scoop.sh | iex
          scoop bucket add craftbag https://github.com/craftbag/scoop-bucket
          scoop install craftbag/craftbag
          craftbag --version
          craftbag-mcp --version
