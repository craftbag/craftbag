# Opens a microsoft/winget-pkgs version pull request.
# The first package is Craftbag.Craftbag (0.1.0 is already on master).
# winget-releaser cannot create that id. fork-user is the fork owner,
# not the craftbag org.
name: Publish WinGet package

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (for example v0.2.0)"
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Empty uses the latest GitHub Release."
        required: false
        type: string
        default: ""

concurrency:
  group: publish-winget-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Open winget-pkgs pull request
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - name: Resolve tag
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo craftbag/craftbag --json tagName --jq .tagName)"
          fi
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved winget ${tag}"
      - name: Skip without a token
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: |
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OK: WINGET_TOKEN is unset"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.gate.outputs.present == 'true'
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Craftbag.Craftbag
          version: ${{ steps.meta.outputs.version }}
          release-tag: ${{ steps.meta.outputs.tag }}
          installers-regex: craftbag-x86_64-pc-windows-msvc\.zip$
          fork-user: SebTardif
          token: ${{ secrets.WINGET_TOKEN }}
